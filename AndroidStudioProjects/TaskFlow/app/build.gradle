plugins {
    id 'com.android.application'
}

// ── Load the Groq API key from local.properties (git-ignored, never committed) ──
// Add a line   GROQ_API_KEY=gsk_your_new_key   to local.properties.
// It gets baked into the APK at build time via BuildConfig.GROQ_API_KEY.
def groqApiKey = ""
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    def localProps = new Properties()
    localProps.load(new FileInputStream(localPropsFile))
    groqApiKey = localProps.getProperty("GROQ_API_KEY", "")
}
// Fallback to a Gradle property or environment variable (useful for CI builds).
if (groqApiKey?.isEmpty()) {
    groqApiKey = (project.findProperty("GROQ_API_KEY") ?: System.getenv("GROQ_API_KEY") ?: "").toString()
}

android {
    namespace 'com.taskflow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.taskflow.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Exposed to Java as BuildConfig.GROQ_API_KEY
        buildConfigField "String", "GROQ_API_KEY", "\"${groqApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // viewBinding not needed for WebView-only activity
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'
}
